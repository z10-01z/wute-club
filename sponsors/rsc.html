<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSC — WUTE 电车队</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%2300489b'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='16' font-weight='bold' font-family='Arial'>W</text></svg>">
    <style>
        :root { --bg:#000; --text:#f0f0f2; --text2:#888894; --text3:#555560; --blue:#00489b; --border:rgba(255,255,255,0.06); }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; }
        body { font-family:'Arial','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); line-height:1.8; letter-spacing:.03em; -webkit-font-smoothing:antialiased; }
        nav { position:fixed; top:0; left:0; width:100%; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 5%; z-index:100; background:rgba(0,0,0,.9); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
        nav a { color:var(--text2); text-decoration:none; font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; transition:color .4s; }
        nav a:hover { color:#fff; }
        nav .title { position:absolute; left:50%; transform:translateX(-50%); color:var(--text); font-size:.85rem; font-weight:700; letter-spacing:.08em; }
        nav img { height:28px; }
        .hero { padding:140px 5% 60px; text-align:center; background:radial-gradient(ellipse at center,rgba(0,72,155,.15) 0%,transparent 70%); }
        .hero .num { display:block; font-family:'JetBrains Mono','Consolas',monospace; font-size:.7rem; color:var(--text3); letter-spacing:.15em; text-transform:uppercase; margin-bottom:1.5rem; }
        .hero .logo-box { display:inline-block; background:rgba(255,255,255,.95); border-radius:8px; padding:2rem 3rem; margin-bottom:1.5rem; }
        .hero .logo-box img { max-width:260px; max-height:100px; object-fit:contain; }
        .hero h1 { font-size:clamp(2rem,5vw,3.5rem); font-weight:800; letter-spacing:.08em; margin-bottom:.5rem; line-height:1.1; }
        .hero .en { font-size:.9rem; color:var(--text3); letter-spacing:.15em; text-transform:uppercase; }
        .content { max-width:720px; margin:0 auto; padding:4rem 5% 8rem; }
        .content h2 { font-size:1.2rem; margin:3rem 0 1.25rem; color:#fff; letter-spacing:.06em; font-weight:700; }
        .content h2::before { content:'// '; color:var(--blue); font-weight:400; }
        .content p { color:var(--text2); font-size:.95rem; margin-bottom:1rem; line-height:1.85; }
        .content ul { padding-left:1.5rem; margin-bottom:1.5rem; }
        .content li { color:var(--text2); font-size:.9rem; margin-bottom:.5rem; line-height:1.7; }
        .content li::marker { color:var(--blue); }
        .back { display:block; text-align:center; padding:3rem; color:var(--text3); text-decoration:none; font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; border-top:1px solid var(--border); transition:color .4s; }
        .back:hover { color:#fff; }
    </style>
</head>
<body>
<nav>
    <a href="../index.html">返回首页</a>
    <span class="title">RSC</span>
    <img src="../picture/WUTE_logo_white.png" alt="WUTE" style="height:28px;">
</nav>
<div class="hero">
    <span class="num">Official Sponsor</span>
    <div class="logo-box">
        <img src="../赞助商/赞助商-RSC.png" alt="RSC">
    </div>
    <h1>RSC</h1>
    <p class="en">车队合作伙伴</p>
</div>
<div class="content">
    <h2>关于 RSC</h2>
    <p>[RSC 介绍文案待补充]</p>
    <h2>合作内容</h2>
    <p>[合作详情文案待补充]</p>
</div>
<a href="../index.html#sponsors" class="back">← 返回官方赞助商</a>
</body>
</html>
