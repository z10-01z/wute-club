    <style>
        :root {
            --bg: #000;
            --text: #f0f0f2;
            --text2: #888894;
            --text3: #555560;
            --blue: #00489b;
            --border: rgba(255, 255, 255, 0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            letter-spacing: 0.03em;
            -webkit-font-smoothing: antialiased;
        }
        nav {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        nav a {
            color: var(--text2);
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.4s;
        }
        nav a:hover { color: #fff; }
        nav img { height: 28px; }

        .hero {
            padding: 140px 5% 60px;
            text-align: center;
            background: radial-gradient(ellipse at center, rgba(0, 72, 155, 0.15) 0%, transparent 70%);
        }
        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            letter-spacing: 0.06em;
            margin-bottom: 1rem;
        }
        .hero .meta {
            font-size: 0.75rem;
            color: var(--text3);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .gallery {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 5% 6rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }
        .card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            transition: border-color 0.4s;
        }
        .card:hover { border-color: rgba(255, 255, 255, 0.15); }
        .card img { width: 100%; display: block; }
        .card .author {
            padding: 1rem 1.25rem;
            color: var(--text2);
            font-size: 0.8rem;
            letter-spacing: 0.06em;
        }

        footer {
            text-align: center;
            padding: 2.5rem 5%;
            color: var(--text3);
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            border-top: 1px solid var(--border);
        }
        footer a { color: var(--text3); text-decoration: none; }
        footer a:hover { color: var(--text2); }
    </style>
</head>

        <div class="card"><img width="706" height="1062" loading="lazy" src="红包封面/许董欣-2.jpg" alt="许董欣"><div class="author">作者：许董欣</div></div>
        <div class="card"><img width="950" height="1266" loading="lazy" src="红包封面/张丁月-2ys.jpg" alt="张丁月"><div class="author">作者：张丁月</div></div>
